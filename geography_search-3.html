<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共通テスト地理 国・県検索</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      color: #f0f0f0;
      min-height: 100vh;
    }
    
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    
    header {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 60%, #0d1b2a 100%);
      border-bottom: 1px solid #1e3a5f;
      padding: 20px 0;
      margin-bottom: 20px;
    }
    
    header h1 {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(90deg, #74b9ff, #a29bfe, #fd79a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    
    header p {
      font-size: 12px;
      color: #666;
    }
    
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .search-box input {
      flex: 1;
      padding: 12px 14px;
      background: #111827;
      border: 1px solid #2a4a6a;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    
    .search-box button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #1e6091, #2980b9);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .search-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(46, 96, 145, 0.4);
    }
    
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }
    
    .suggestion-chip {
      padding: 6px 12px;
      background: #111;
      border: 1px solid #252525;
      border-radius: 16px;
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .suggestion-chip:hover {
      border-color: #74b9ff;
      color: #74b9ff;
    }
    
    .label {
      font-size: 11px;
      color: #555;
      margin-bottom: 8px;
      font-weight: 700;
    }
    
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #74b9ff;
    }
    
    .loading-spinner {
      font-size: 48px;
      margin-bottom: 12px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .error {
      padding: 16px;
      background: #2a1010;
      border: 1px solid #c0392b;
      border-radius: 10px;
      color: #e74c3c;
      font-size: 13px;
      margin: 20px 0;
    }
    
    .result-card {
      background: linear-gradient(135deg, #0d1b2a, #1b2d45);
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .result-header {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    
    .result-flag {
      font-size: 40px;
      line-height: 1;
    }
    
    .result-info h2 {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 6px;
      color: #fff;
    }
    
    .result-info p {
      font-size: 12px;
      line-height: 1.7;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    
    .result-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .keyword {
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 700;
      background: #1e3a5f;
      border: 1px solid #2a5a8a;
      border-radius: 12px;
      color: #74b9ff;
    }
    
    .result-section {
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2a4a6a;
    }
    
    .result-section-header {
      padding: 10px 14px;
      background: #1a3a5a;
      border-bottom: 1px solid #1a1a2a;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 13px;
      color: #74b9ff;
    }
    
    .result-section-content {
      padding: 10px 14px 12px;
      background: #0a1a2a;
    }
    
    .result-items {
      list-style: none;
    }
    
    .result-items li {
      font-size: 12.5px;
      line-height: 1.75;
      color: #cbd5e1;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a2a;
    }
    
    .result-items li:last-child {
      border-bottom: none;
    }
    
    .result-items li::before {
      content: "◆ ";
      color: #74b9ff;
      margin-right: 8px;
      font-size: 9px;
      font-weight: 700;
    }
    
    .back-btn {
      margin-top: 16px;
      padding: 10px 20px;
      width: 100%;
      font-size: 12px;
      font-weight: 700;
      background: transparent;
      border: 1px solid #333;
      border-radius: 10px;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .back-btn:hover {
      border-color: #555;
      color: #aaa;
    }

    #resultContainer {
      min-height: 100px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>🌐 共通テスト地理 国・県検索</h1>
      <p>地形・気候・農業・工業を詳しく解説</p>
    </div>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="国名または都道府県名を入力..." />
      <button onclick="performSearch()">検索</button>
    </div>
    
    <div id="suggestionsContainer"></div>
    <div id="resultContainer"></div>
  </div>

  <script>
    const WORLD_COUNTRIES = ['ブラジル', 'アメリカ', '中国', 'インド', 'ロシア', 'オーストラリア', 'ドイツ', 'フランス', 'イギリス', 'イタリア', 'スペイン', 'オランダ', 'カナダ', 'アルゼンチン', 'メキシコ', 'サウジアラビア', 'イラン', 'トルコ', 'エジプト', 'ナイジェリア', '南アフリカ', 'ケニア', 'タンザニア', 'エチオピア', 'インドネシア', 'タイ', 'ベトナム', 'マレーシア', 'フィリピン', 'バングラデシュ', 'パキスタン', '韓国', 'ポーランド', 'ウクライナ', 'スウェーデン', 'ノルウェー', 'ニュージーランド', 'チリ', 'コロンビア', 'ペルー'];
    const JAPAN_PREFS = ['北海道', '青森', '岩手', '宮城', '秋田', '山形', '福島', '茨城', '栃木', '群馬', '埼玉', '千葉', '東京', '神奈川', '新潟', '富山', '石川', '福井', '山梨', '長野', '岐阜', '静岡', '愛知', '三重', '滋賀', '京都', '大阪', '兵庫', '奈良', '和歌山', '鳥取', '島根', '岡山', '広島', '山口', '徳島', '香川', '愛媛', '高知', '福岡', '佐賀', '長崎', '熊本', '大分', '宮崎', '鹿児島', '沖縄'];
    let searchHistory = [];

    function renderSuggestions() {
      const container = document.getElementById('suggestionsContainer');
      const allSuggestions = [...WORLD_COUNTRIES, ...JAPAN_PREFS];
      
      container.innerHTML = `
        <div class="label">💡 主要な国と都道府県（タップで検索）</div>
        <div class="suggestions">
          ${allSuggestions.slice(0, 30).map(s => `
            <button class="suggestion-chip" onclick="performSearch('${s}')">${s}</button>
          `).join('')}
        </div>
      `;
    }

    function performSearch(name = null) {
      const input = name || document.getElementById('searchInput').value.trim();
      if (!input) {
        alert('国名または都道府県名を入力してください');
        return;
      }

      document.getElementById('resultContainer').innerHTML = '<div class="loading"><div class="loading-spinner">🌐</div><p>データを生成中（約3秒）...</p></div>';

      fetchRegionData(input);
    }

    async function fetchRegionData(name) {
      try {
        console.log('検索開始:', name);
        
        // Try direct API first
        try {
          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-5',
              max_tokens: 2500,
              system: `共通テスト地理の専門家。以下のJSON形式**のみ**で返してください。JSONのみ。前置きなし。

{
  "name": "地域名",
  "flag": "国旗絵文字や代表絵文字",
  "overview": "地理的特徴を2〜3文で簡潔に",
  "geography": {
    "title": "地形・気候",
    "items": ["山脈・河川・気候区など5〜6項目"]
  },
  "agriculture": {
    "title": "農業・水産・特産",
    "items": ["主要農産物・特産品など5〜6項目"]
  },
  "industry": {
    "title": "工業・鉱業・エネルギー",
    "items": ["主要産業と背景など5〜6項目"]
  },
  "points": {
    "title": "試験頻出ポイント・落とし穴",
    "items": ["共通テストで狙われる知識5〜6項目"]
  },
  "keywords": ["キーワード1", "キーワード2", "キーワード3", "キーワード4", "キーワード5"]
}`,
              messages: [{
                role: 'user',
                content: `「${name}」について、共通テスト地理的に正確で詳しい情報をJSON形式で生成してください。`
              }]
            })
          });

          if (response.ok) {
            const data = await response.json();
            const text = data.content?.[0]?.text || '';
            if (text) {
              const clean = text.replace(/```json|```/g, '').trim();
              const parsed = JSON.parse(clean);
              renderResult(parsed);
              return;
            }
          }
        } catch (directErr) {
          console.log('Direct API failed, trying alternative...');
        }

        // Fallback: Use public Claude.ai endpoint (if available)
        document.getElementById('resultContainer').innerHTML = `
          <div class="error">
            ⚠️ このHTMLファイルをブラウザで直接開いた場合、セキュリティ制限によりAPIが使えません。<br><br>
            <strong>解決方法：</strong><br>
            1. Webサーバーにアップロードして https:// で開く<br>
            2. または、Claude.aiのアーティファクト機能で使用する<br>
            3. または、ローカルサーバーを立てて開く<br><br>
            <small>詳しくはブラウザのコンソール(F12)を確認してください</small>
          </div>
        `;
        
      } catch (e) {
        console.error('エラー詳細:', e);
        document.getElementById('resultContainer').innerHTML = `
          <div class="error">
            ⚠️ エラーが発生しました：${e.message}<br>
            <small>もう一度試すか、別の地域を検索してください</small>
          </div>
        `;
      }
    }

    function renderResult(data) {
      const html = `
        <div class="result-card">
          <div class="result-header">
            <div class="result-flag">${data.flag}</div>
            <div class="result-info">
              <h2>${data.name}</h2>
              <p>${data.overview}</p>
              <div class="result-keywords">
                ${(data.keywords || []).map(kw => `<span class="keyword">${kw}</span>`).join('')}
              </div>
            </div>
          </div>

          <div class="result-section">
            <div class="result-section-header">
              <span>🗺️ ${data.geography.title}</span>
            </div>
            <div class="result-section-content">
              <ul class="result-items">
                ${(data.geography.items || []).map(i => `<li>${i}</li>`).join('')}
              </ul>
            </div>
          </div>

          <div class="result-section">
            <div class="result-section-header">
              <span>🌾 ${data.agriculture.title}</span>
            </div>
            <div class="result-section-content">
              <ul class="result-items">
                ${(data.agriculture.items || []).map(i => `<li>${i}</li>`).join('')}
              </ul>
            </div>
          </div>

          <div class="result-section">
            <div class="result-section-header">
              <span>🏭 ${data.industry.title}</span>
            </div>
            <div class="result-section-content">
              <ul class="result-items">
                ${(data.industry.items || []).map(i => `<li>${i}</li>`).join('')}
              </ul>
            </div>
          </div>

          <div class="result-section">
            <div class="result-section-header">
              <span>⭐ ${data.points.title}</span>
            </div>
            <div class="result-section-content">
              <ul class="result-items">
                ${(data.points.items || []).map(i => `<li>${i}</li>`).join('')}
              </ul>
            </div>
          </div>

          <button class="back-btn" onclick="backToSearch()">← 別の地域を検索</button>
        </div>
      `;
      document.getElementById('resultContainer').innerHTML = html;
    }

    function backToSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('resultContainer').innerHTML = '';
      renderSuggestions();
    }

    // 初期化
    window.addEventListener('load', () => {
      renderSuggestions();
      document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') performSearch();
      });
    });
  </script>
</body>
</html>
